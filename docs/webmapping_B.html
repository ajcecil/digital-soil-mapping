<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CALS Soil Data — Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .leaflet-control-scale-line {
      font-size: 16px;
      line-height: 1.2;
      padding: 4px 8px;
    }

    .legend {
      line-height: 18px;
      color: #555;
      background: white;
      padding: 8px;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .legend img {
      width: 60px;
      display: block;
      margin-top: 5px;
    }

    .boundary-status {
      max-width: 260px;
      padding: 8px 12px;
      background: white;
      color: #444;
      border-radius: 5px;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.25);
      font: 13px/1.4 sans-serif;
      overflow-wrap: anywhere;
    }

    .boundary-status.error {
      color: #a40000;
      border: 1px solid #a40000;
    }

    .polygon-filter {
      width: 270px;
      max-width: calc(100vw - 90px);
      max-height: calc(100vh - 150px);
      overflow-y: auto;
      box-sizing: border-box;
      padding: 12px;
      background: white;
      border-radius: 5px;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.25);
      font: 13px/1.4 sans-serif;
    }

    .polygon-filter-title {
      margin-bottom: 5px;
      font-weight: 600;
    }

    .polygon-filter-help {
      color: #666;
      margin-bottom: 8px;
    }

    .polygon-filter label {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin: 6px 0;
      cursor: pointer;
    }

    .polygon-filter input {
      margin-top: 3px;
      flex-shrink: 0;
    }

    .polygon-filter-list {
      max-height: 230px;
      overflow-y: auto;
      margin-top: 8px;
      border-top: 1px solid #ddd;
      padding-top: 6px;
    }

    .polygon-filter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .polygon-filter-actions button {
      cursor: pointer;
      padding: 5px 8px;
    }

    .polygon-filter-actions button:disabled {
      cursor: default;
      opacity: 0.5;
    }

    .polygon-filter-summary {
      margin-top: 8px;
      color: #555;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/shpjs@6.2.0/dist/shp.js"></script>

  <script>
    window.addEventListener("load", () => {
      // ========================================================
      // Configuration
      // ========================================================

      const BOUNDARY_BASE =
        "page_files/maps/boundaries/field_boundaries";

      const POLYGON_LABEL_FIELD = "PROPERTY_N";

      const MIN_ZOOM = 9;
      const MAX_ZOOM = 18;

      const SHOW_BOUNDARY_OUTLINE = true;

      // Keep false for the same XYZ addressing as your original.
      // Set true only if your tile folders use TMS Y numbering.
      const SOIL_TILES_TMS = false;

      const rasterBounds = L.latLngBounds(
        [40.609027, -96.074858],
        [43.467584, -91.141255]
      );

      // ========================================================
      // Map and basemaps
      // ========================================================

      const map = L.map("map", {
        minZoom: MIN_ZOOM,
        maxZoom: MAX_ZOOM,
        maxBounds: rasterBounds,
        zoomAnimation: true,
        fadeAnimation: true
      });

      map.fitBounds(rasterBounds);

      map.createPane("soilPane");
      map.getPane("soilPane").style.zIndex = "350";
      map.getPane("soilPane").style.pointerEvents = "none";

      map.createPane("boundaryPane");
      map.getPane("boundaryPane").style.zIndex = "450";
      map.getPane("boundaryPane").style.pointerEvents = "none";

      const sat = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/" +
        "World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          attribution:
            "Tiles &copy; Esri — Source: Esri, Earthstar Geographics, " +
            "Maxar, GeoEye, USDA FSA, USGS, AeroGRID, IGN, " +
            "and the GIS User Community",
          maxZoom: MAX_ZOOM
        }
      ).addTo(map);

      const osm = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution: "&copy; OpenStreetMap contributors",
          maxZoom: MAX_ZOOM
        }
      );

      // ========================================================
      // Boundary-loading status
      // ========================================================

      let statusElement;

      const statusControl = L.control({
        position: "topleft"
      });

      statusControl.onAdd = function () {
        statusElement = L.DomUtil.create(
          "div",
          "boundary-status"
        );

        statusElement.setAttribute("role", "status");
        statusElement.textContent = "Loading polygon filters…";

        L.DomEvent.disableClickPropagation(statusElement);
        L.DomEvent.disableScrollPropagation(statusElement);

        return statusElement;
      };

      statusControl.addTo(map);

      // ========================================================
      // Filter state
      // ========================================================

      let allBoundaryFeatures = [];

      // Empty selection always means full raster.
      const selectedPolygonIds = new Set();

      // null = no clipping.
      let activeBoundary = null;

      // Projection cache is specific to the current selection.
      const projectedBoundaryCache = new Map();

      const boundaryLayer = L.geoJSON(null, {
        pane: "boundaryPane",
        interactive: false,
        style: {
          color: "#ff7800",
          weight: 2,
          opacity: 1,
          fill: false
        }
      });

      if (SHOW_BOUNDARY_OUTLINE) {
        boundaryLayer.addTo(map);
      }

      // ========================================================
      // Project polygons into global pixels at a tile's zoom
      // ========================================================

      function getProjectedPolygons(zoom) {
        if (activeBoundary === null) {
          return null;
        }

        if (projectedBoundaryCache.has(zoom)) {
          return projectedBoundaryCache.get(zoom);
        }

        const result = [];

        for (const feature of activeBoundary.features) {
          const geometry = feature.geometry;

          const polygons = geometry.type === "Polygon"
            ? [geometry.coordinates]
            : geometry.coordinates;

          for (const polygon of polygons) {
            const rings = polygon.map(ring =>
              ring.map(coordinate =>
                map.project(
                  L.latLng(coordinate[1], coordinate[0]),
                  zoom
                )
              )
            );

            const bounds = L.bounds();

            for (const ring of rings) {
              for (const point of ring) {
                bounds.extend(point);
              }
            }

            if (bounds.isValid()) {
              result.push({ rings, bounds });
            }
          }
        }

        projectedBoundaryCache.set(zoom, result);

        return result;
      }

      // ========================================================
      // Canvas raster layer
      // ========================================================

      const MaskedRasterLayer = L.GridLayer.extend({
        initialize: function (urlTemplate, options) {
          this._urlTemplate = urlTemplate;
          L.setOptions(this, options);
        },

        createTile: function (coords, done) {
          const tile = document.createElement("canvas");
          const size = this.getTileSize();

          tile.width = size.x;
          tile.height = size.y;

          const context = tile.getContext("2d");

          const complete = (error = null) => {
            setTimeout(() => done(error, tile), 0);
          };

          if (!context) {
            complete(new Error("Could not create a canvas context."));
            return tile;
          }

          const origin = L.point(
            coords.x * size.x,
            coords.y * size.y
          );

          const pixelBounds = L.bounds(
            origin,
            origin.add(size)
          );

          // Capture the selection for this tile before loading.
          const polygons = getProjectedPolygons(coords.z);

          let mask = null;

          if (polygons !== null) {
            const overlappingPolygons = polygons.filter(
              polygon => polygon.bounds.intersects(pixelBounds)
            );

            if (overlappingPolygons.length === 0) {
              // Return blank tile if outside filter bounds
              complete();
              return tile;
            }

            mask = document.createElement("canvas");
            mask.width = size.x;
            mask.height = size.y;

            const maskContext = mask.getContext("2d");

            if (!maskContext) {
              complete(new Error("Could not create a mask context."));
              return tile;
            }

            maskContext.fillStyle = "#fff";

            for (const polygon of overlappingPolygons) {
              maskContext.beginPath();

              for (const ring of polygon.rings) {
                ring.forEach((point, index) => {
                  const x = point.x - origin.x;
                  const y = point.y - origin.y;

                  if (index === 0) {
                    maskContext.moveTo(x, y);
                  } else {
                    maskContext.lineTo(x, y);
                  }
                });

                maskContext.closePath();
              }

              maskContext.fill("evenodd");
            }
          }

          const y = this.options.tms
            ? Math.pow(2, coords.z) - 1 - coords.y
            : coords.y;

          const url = L.Util.template(this._urlTemplate, {
            x: coords.x,
            y,
            z: coords.z
          });

          const image = new Image();
          image.crossOrigin = "";

          image.onload = () => {
            try {
              context.clearRect(0, 0, size.x, size.y);
              context.drawImage(
                image,
                0,
                0,
                size.x,
                size.y
              );

              if (mask) {
                context.globalCompositeOperation = "destination-in";
                context.drawImage(mask, 0, 0);
                context.globalCompositeOperation = "source-over";
              }

              complete();
            } catch (error) {
              complete(error);
            }
          };

          image.onerror = () => {
            // Fail silently or pass error back
            complete();
          };

          image.src = url;

          return tile;
        }
      });

      // ========================================================
      // Soil layers
      // ========================================================

      function makeSoilLayer(folder, attribution) {
        const layer = new MaskedRasterLayer(
          `page_files/maps/${folder}/tiles/{z}/{x}/{y}.png`,
          {
            attribution,
            pane: "soilPane",
            opacity: 1,
            tileSize: 256,
            noWrap: true,
            bounds: rasterBounds,
            minZoom: MIN_ZOOM,
            maxZoom: MAX_ZOOM,
            tms: SOIL_TILES_TMS,
            updateWhenZooming: false,
            updateWhenIdle: false,
            keepBuffer: 4
          }
        );

        return layer;
      }

      const phLayer = makeSoilLayer(
        "PH",
        "pH Map Tiles"
      ).addTo(map);

      const bphLayer = makeSoilLayer(
        "BPH",
        "BpH Map Tiles"
      );

      const omLayer = makeSoilLayer(
        "OM",
        "Organic Matter Map Tiles"
      );

      const cecLayer = makeSoilLayer(
        "CEC",
        "CEC Map Tiles"
      );

      const soilLayers = [
        phLayer,
        bphLayer,
        omLayer,
        cecLayer
      ];

      function redrawSoilLayers() {
        projectedBoundaryCache.clear();

        for (const layer of soilLayers) {
          if (map.hasLayer(layer)) {
            // Force recreation of all tile elements cleanly
            layer.redraw();
          }
        }
      }

      L.control.layers(
        {
          "Satellite": sat,
          "OpenStreetMap": osm
        },
        {
          "Soil pH": phLayer,
          "Soil BPH": bphLayer,
          "Organic Matter": omLayer,
          "CEC": cecLayer
        }
      ).addTo(map);

      L.control.scale({
        position: "bottomleft",
        imperial: false
      }).addTo(map);

      // ========================================================
      // Legends
      // ========================================================

      function createLegend(title, imagePath) {
        const legend = L.control({
          position: "bottomright"
        });

        legend.onAdd = function () {
          const div = L.DomUtil.create("div", "legend");

          const heading = document.createElement("strong");
          heading.textContent = title;

          const image = document.createElement("img");
          image.src = imagePath;
          image.alt = `${title} legend`;

          div.append(heading, image);

          L.DomEvent.disableClickPropagation(div);
          L.DomEvent.disableScrollPropagation(div);

          return div;
        };

        return legend;
      }

      const legendEntries = [
        {
          layer: phLayer,
          legend: createLegend(
            "Soil pH",
            "page_files/maps/PH/legend.png"
          )
        },
        {
          layer: bphLayer,
          legend: createLegend(
            "Soil BPH",
            "page_files/maps/BPH/legend.png"
          )
        },
        {
          layer: omLayer,
          legend: createLegend(
            "Organic Matter",
            "page_files/maps/OM/legend.png"
          )
        },
        {
          layer: cecLayer,
          legend: createLegend(
            "CEC",
            "page_files/maps/CEC/legend.png"
          )
        }
      ];

      function updateLegends() {
        for (const entry of legendEntries) {
          if (map.hasLayer(entry.layer)) {
            entry.legend.addTo(map);
          } else {
            entry.legend.remove();
          }
        }
      }

      map.on("overlayadd overlayremove", updateLegends);

      map.on("overlayadd", event => {
        if (soilLayers.includes(event.layer)) {
          event.layer.redraw();
        }
      });

      updateLegends();

      // ========================================================
      // Polygon selection
      // ========================================================

      let filterSummaryElement;
      let clearFiltersButton;
      let zoomButton;

      const polygonCheckboxes = [];

      function getPolygonLabel(feature, index) {
        const value = feature.properties?.[POLYGON_LABEL_FIELD];

        if (
          value !== undefined &&
          value !== null &&
          String(value).trim()
        ) {
          return String(value);
        }

        return `Polygon ${index + 1}`;
      }

      function applyPolygonSelection() {
        const selectedFeatures = allBoundaryFeatures.filter(
          (_, index) => selectedPolygonIds.has(index)
        );

        activeBoundary = selectedFeatures.length > 0
          ? {
              type: "FeatureCollection",
              features: selectedFeatures
            }
          : null;

        boundaryLayer.clearLayers();

        if (activeBoundary !== null) {
          boundaryLayer.addData(activeBoundary);
        }

        for (const item of polygonCheckboxes) {
          item.checkbox.checked =
            selectedPolygonIds.has(item.index);
        }

        const hasSelection = selectedFeatures.length > 0;

        clearFiltersButton.disabled = !hasSelection;

        zoomButton.textContent = hasSelection
          ? "Zoom to selection"
          : "Zoom to full map";

        filterSummaryElement.textContent = hasSelection
          ? `${selectedFeatures.length} of ` +
            `${allBoundaryFeatures.length} polygons selected.`
          : "No filters applied. Showing the full soil raster.";

        redrawSoilLayers();
      }

      function addPolygonFilterControl() {
        const control = L.control({
          position: "topleft"
        });

        control.onAdd = function () {
          const container = L.DomUtil.create(
            "div",
            "polygon-filter"
          );

          const title = document.createElement("div");
          title.className = "polygon-filter-title";
          title.textContent = "Filter soil maps by polygon";

          const help = document.createElement("div");
          help.className = "polygon-filter-help";
          help.textContent =
            "Select polygons to filter. Leave all unchecked " +
            "to show the full map.";

          const list = document.createElement("div");
          list.className = "polygon-filter-list";

          allBoundaryFeatures.forEach((feature, index) => {
            const label = document.createElement("label");

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = false;

            const text = document.createElement("span");
            text.textContent = getPolygonLabel(feature, index);

            checkbox.addEventListener("change", () => {
              if (checkbox.checked) {
                selectedPolygonIds.add(index);
              } else {
                selectedPolygonIds.delete(index);
              }

              applyPolygonSelection();
            });

            polygonCheckboxes.push({ checkbox, index });

            label.append(checkbox, text);
            list.appendChild(label);
          });

          const actions = document.createElement("div");
          actions.className = "polygon-filter-actions";

          const selectAllButton = document.createElement("button");
          selectAllButton.type = "button";
          selectAllButton.textContent = "Select all";

          selectAllButton.addEventListener("click", () => {
            allBoundaryFeatures.forEach((_, index) => {
              selectedPolygonIds.add(index);
            });

            applyPolygonSelection();
          });

          clearFiltersButton = document.createElement("button");
          clearFiltersButton.type = "button";
          clearFiltersButton.textContent = "Clear filters";

          clearFiltersButton.addEventListener("click", () => {
            selectedPolygonIds.clear();
            applyPolygonSelection();
          });

          zoomButton = document.createElement("button");
          zoomButton.type = "button";

          zoomButton.addEventListener("click", () => {
            const bounds = activeBoundary === null
              ? rasterBounds
              : boundaryLayer.getBounds();

            if (bounds.isValid()) {
              map.fitBounds(bounds, {
                paddingTopLeft: [30, 30],
                paddingBottomRight: [30, 30],
                maxZoom: MAX_ZOOM
              });
            }
          });

          actions.append(
            selectAllButton,
            clearFiltersButton,
            zoomButton
          );

          filterSummaryElement = document.createElement("div");
          filterSummaryElement.className = "polygon-filter-summary";
          filterSummaryElement.setAttribute("role", "status");
          filterSummaryElement.setAttribute("aria-live", "polite");

          container.append(
            title,
            help,
            list,
            actions,
            filterSummaryElement
          );

          L.DomEvent.disableClickPropagation(container);
          L.DomEvent.disableScrollPropagation(container);

          return container;
        };

        control.addTo(map);
      }

      // ========================================================
      // Load existing shapefile
      // ========================================================

      async function fetchBoundaryFile(extension, asText = false) {
        const url = `${BOUNDARY_BASE}.${extension}`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(
            `Could not load ${url}: HTTP ${response.status}`
          );
        }

        return asText
          ? response.text()
          : response.arrayBuffer();
      }

      async function loadExistingBoundary() {
        try {
          const [shpBuffer, dbfBuffer, projection] =
            await Promise.all([
              fetchBoundaryFile("shp"),
              fetchBoundaryFile("dbf"),
              fetchBoundaryFile("prj", true)
            ]);

          if (!projection.trim()) {
            throw new Error("The boundary .prj file is empty.");
          }

          const geojson = await shp({
            shp: shpBuffer,
            dbf: dbfBuffer,
            prj: projection
          });

          const collections = Array.isArray(geojson)
            ? geojson
            : [geojson];

          allBoundaryFeatures = collections
            .flatMap(collection => collection.features || [])
            .filter(feature =>
              feature.geometry &&
              (
                feature.geometry.type === "Polygon" ||
                feature.geometry.type === "MultiPolygon"
              )
            );

          if (allBoundaryFeatures.length === 0) {
            throw new Error(
              "The shapefile contains no polygon features."
            );
          }

          const bounds = L.geoJSON({
            type: "FeatureCollection",
            features: allBoundaryFeatures
          }).getBounds();

          if (!bounds.isValid()) {
            throw new Error("The boundary coordinates are invalid.");
          }

          if (!rasterBounds.intersects(bounds)) {
            throw new Error(
              "The boundary is outside the soil raster extent. " +
              "Check the shapefile and its projection."
            );
          }

          // Start with nothing selected: full raster.
          selectedPolygonIds.clear();

          addPolygonFilterControl();
          applyPolygonSelection();

          statusControl.remove();

          console.info(
            "Boundary loaded:",
            allBoundaryFeatures.length,
            "polygon features"
          );
        } catch (error) {
          console.error("Boundary loading failed:", error);

          selectedPolygonIds.clear();
          activeBoundary = null;

          boundaryLayer.clearLayers();
          redrawSoilLayers();

          statusElement.classList.add("error");
          statusElement.textContent =
            "Polygon filters could not be loaded. " +
            "The full soil raster remains available. " +
            error.message;
        }
      }

      loadExistingBoundary();
    });
  </script>
</body>
</html>
